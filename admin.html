<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<!-- adm-version:7 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17110f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="دعوات">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17110f">
<title>لوحة الدعوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#17110f;--bg2:#201816;--bg3:#2a201d;--line:#3a2d29;--tx:#f3e9e3;--mu:#a8978f;--rose:#d98ca2;--rose2:#b05c78;--gold:#d4b04a;--ok:#4cc38a;--bad:#e0707a;--wait:#e3b448;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.55}
body{padding-bottom:150px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--rose)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:30;background:rgba(23,17,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
header .wrap{display:flex;align-items:center;gap:10px}
.logo{font-family:"Aref Ruqaa",serif;font-size:22px;color:var(--rose);flex:none}
.sw{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--rose2);border-radius:16px;padding:6px 14px;text-align:right;background:var(--bg2);min-width:0}
.sw b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw>svg{width:20px;height:20px;flex:none;color:var(--rose)}
.sw small{color:var(--mu);font-size:12.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-inline-start:6px}
.menu{position:absolute;inset-inline:16px;top:62px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:0 18px 40px #0009;max-width:528px;margin:0 auto}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;text-align:right}
.menu button:hover{background:var(--bg3)}
.menu .it.on{background:var(--bg3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(32,24,22,.97);border-top:1px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav.tabs .wrap{display:flex;gap:6px}
nav.tabs button{flex:1;padding:8px 4px;border-radius:14px;color:var(--mu);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{background:var(--bg3);color:var(--rose);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
h2{font-size:20px;margin:18px 0 6px}
h3{font-size:16.5px;margin:0 0 6px}
.mu{color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:14px;background:var(--rose2);color:#fff;font-weight:700;border:1px solid transparent}
.btn.ghost{background:none;border-color:var(--rose);color:var(--rose)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.gold{background:var(--gold);color:#241b08}
.btn.red{background:none;border-color:var(--bad);color:var(--bad)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
input[type=text],input[type=url],input[type=tel],input[type=datetime-local],input[type=number],input[type=time],input[type=password],select,textarea{width:100%;background:#120d0c;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
textarea{min-height:84px;resize:vertical}
.linkbox{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:#120d0c;border:1px solid var(--line);border-radius:12px;padding:12px}
.acc{border:1px solid var(--line);border-radius:var(--r);margin:10px 0;background:var(--bg2);overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;text-align:right}
.acc>button b{font-size:16.5px}
.acc>button span{color:var(--mu);font-size:13px;display:block;font-weight:400}
.acc>button svg{width:20px;height:20px;color:var(--mu)}
.acc .body{padding:4px 16px 16px;border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg3);font-size:14px}
.chip.on{border-color:var(--rose);color:var(--rose);background:#2d1d22}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.themes button{border:2px solid transparent;border-radius:14px;padding:6px 2px;background:var(--bg3);font-size:12.5px}
.themes button.on{border-color:var(--rose)}
.themes i{display:block;height:34px;border-radius:9px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:21px}
.stat small{color:var(--mu);font-size:11px;line-height:1.3;display:block}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.wait b{color:var(--wait)}
.g{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;margin:8px 0;background:var(--bg2)}
.gt{display:flex;align-items:center;gap:10px}
.ga{display:flex;gap:8px;flex-wrap:wrap}
.ga .ic{flex:1;min-width:40px;width:auto}
.btn{white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;background:#3a2330;color:var(--rose);display:grid;place-items:center;font-weight:700;flex:none}
.pill{font-size:12.5px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:#12301f;color:var(--ok)}.pill.bad{background:#34171b;color:var(--bad)}.pill.wait{background:#33280f;color:var(--wait)}
.ic{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--tx)}
.ic svg{width:19px;height:19px}
.tabs2{display:flex;border-bottom:1px solid var(--line);margin:8px 0}
.tabs2 button{flex:1;padding:12px;color:var(--mu);font-weight:700;border-bottom:3px solid transparent}
.tabs2 button.on{color:var(--rose);border-color:var(--rose)}
.save{position:fixed;inset-inline:0;bottom:74px;z-index:29;padding:0 16px}
.save .in{max-width:528px;margin:0 auto;background:#2d1d22;border:1px solid var(--rose2);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px #000a}
.toast{position:fixed;top:78px;inset-inline:0;z-index:99;display:flex;justify-content:center;pointer-events:none}
.toast span{background:#fff;color:#241;padding:9px 18px;border-radius:99px;font-weight:700;box-shadow:0 8px 24px #0008}
.toast.err span{background:#e0707a;color:#fff}
.bubble{background:#1f4d3a;border-radius:16px;padding:14px;white-space:pre-wrap;font-size:14.5px;margin:10px 0}
.modal{position:fixed;inset:0;z-index:80;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;width:100%;max-width:420px;max-height:94vh;overflow:auto;padding:16px}
.phone{width:100%;height:min(74vh,720px);border:0;border-radius:18px;background:#fff}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps>li{counter-increment:s;position:relative;padding:8px 44px 8px 0;margin:6px 0}
.steps>li:before{content:counter(s);position:absolute;right:0;top:6px;width:30px;height:30px;border-radius:50%;background:var(--rose2);display:grid;place-items:center;font-weight:700}
.warn{background:#3a1d1f;border:1px solid var(--bad);color:#ffd5d8;border-radius:14px;padding:12px;margin:12px 0;font-size:14.5px}
pre.code{direction:ltr;text-align:left;background:#0d0908;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11.5px;max-height:130px;overflow:auto;white-space:pre}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.inv{display:flex;gap:12px;align-items:center}
.sq{width:46px;height:46px;border-radius:13px;flex:none}
[hidden]{display:none!important}

.pre{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.pre button{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg3);padding:0;text-align:center}
.pre button.on{outline:2px solid var(--gold,#c9a24b)}
.pre .th{height:92px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"Aref Ruqaa",serif;font-size:20px}
.pre .th i{display:block;width:46px;height:1px;opacity:.7}
.pre .th small{font:500 10px Tajawal,sans-serif;opacity:.7}
.pre span{display:block;padding:7px 4px;font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#000a;color:#fff;font-size:14px;line-height:1}
.evrow{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:var(--bg3)}
.ck{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.ck li{display:flex;gap:8px;align-items:center;font-size:14.5px}
.ck li b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--line);flex:none}
.ck li.ok b{background:#4cc38a;color:#06210f;border-color:#4cc38a}
.ck li.ok span{opacity:.6}
.bar{height:6px;border-radius:9px;background:var(--bg3);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a24b,#e6c878)}
#side{display:none}
@media(min-width:1100px){body.split #side{display:block;position:fixed;top:14px;bottom:96px;left:18px;width:392px;z-index:20}
 body.split #app{padding-left:430px}
 #side .fr{width:100%;height:calc(100% - 44px);border:1px solid var(--line);border-radius:26px;background:#fff}
 #side .row{margin-bottom:8px;justify-content:space-between}}
body.staff .sw{pointer-events:none}body.staff .sw svg{display:none}
.brandbar{display:flex;align-items:center;gap:8px;font-family:"Aref Ruqaa",serif;font-size:20px;color:#c9a24b}

/* ---- v11 app polish ---- */
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--rose2);color:#fff;font-weight:600;font-size:15px;box-shadow:none;letter-spacing:0}
.btn.gold{background:var(--rose2);color:#fff}
.btn.ghost{background:var(--bg3);border:1px solid var(--line);color:var(--tx)}
.btn.red{background:rgba(224,112,122,.12);border:0;color:var(--bad)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn:active{transform:scale(.98)}
.ic{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg3);color:var(--tx)}
.ic.wa{background:rgba(76,195,138,.14);color:var(--ok)}
.ga{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}
.ga .ic{flex:none;width:40px;min-width:0}
.ga .btn{flex:1}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;border-bottom:1px solid var(--line);font-size:15.5px;text-align:start}
.mi:last-child{border:0}.mi svg{width:20px;height:20px;color:var(--mu)}.mi.red{color:var(--bad)}.mi.red svg{color:var(--bad)}
nav.tabs{background:rgba(23,17,15,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:4px}
nav.tabs button{padding:7px 4px;border-radius:12px;font-size:11.5px;font-weight:500;position:relative}
nav.tabs button.on{background:none;color:var(--rose);font-weight:700}
nav.tabs button.on:before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--rose)}
.card{border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.card h3{font-size:16px;margin:0 0 8px}
.chip{padding:6px 13px;font-size:13.5px}
.chip.on{background:rgba(217,140,162,.14)}
.save{background:rgba(32,24,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pk{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.pk button{border:2px solid transparent;border-radius:14px;overflow:hidden;background:var(--bg3);padding:0;text-align:center;font-size:13px}
.pk button.on{border-color:var(--rose)}
.pk .tw{display:flex;height:112px}.pk .tw img{width:50%;height:100%;object-fit:cover;display:block}
.pk span{display:block;padding:7px 4px}
.ph6{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.ph6 button{border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--bg3);padding:0;aspect-ratio:9/16;position:relative;font-size:11px}
.ph6 button.on{border-color:var(--rose)}.ph6 img{width:100%;height:100%;object-fit:cover;display:block}
.ph6 button.tx{aspect-ratio:auto;min-height:54px;padding:6px 2px;color:var(--tx)}
.ph6 button.tx.on{background:rgba(217,140,162,.14)}
.row:has(>.btn.grow){flex-wrap:wrap}.row>.btn.grow{flex:1 1 auto}

.save{bottom:var(--navh,74px);padding:0}
.save .in{max-width:none;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);background:rgba(23,17,15,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:none;padding:8px 16px;min-height:52px}
.dirty{font-size:13.5px;color:var(--mu);display:flex;align-items:center;gap:8px}
.dirty:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wait);flex:none}
.lnk{color:var(--mu);font-size:13.5px;padding:8px 10px}
.btn.full{width:100%}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.trio .btn{padding:0 6px;gap:5px}
.pk .tw{position:relative}.pk .ck2{position:absolute;top:6px;inset-inline-start:6px;width:22px;height:22px;border-radius:50%;background:var(--rose2);color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center}
</style></head>

<script type="text/plain" id="gs">/**
 * خادم الدعوات — Google Apps Script
 * الصق هذا الملف كاملاً في (إضافات ← Apps Script) داخل جدول Google جديد،
 * غيّر المفتاح السري أدناه، ثم: نشر ← نشر كتطبيق ويب ← الوصول: أي شخص.
 */
var ADMIN_KEY = "غيّر-هذا-المفتاح-السري";   // ← مفتاح لوحة العريس (اختر كلمة طويلة)
var CHUNK = 45000;                           // حد الخلية في Google Sheets = 50000

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function sheet_(name, head) {
  var ss = SpreadsheetApp.getActiveSpreadsheet(), s = ss.getSheetByName(name);
  if (!s) { s = ss.insertSheet(name); s.appendRow(head); }
  return s;
}
function S_INV() { return sheet_("Invitations", ["id", "updated", "json..."]); }
function S_GST() { return sheet_("Guests", ["inv", "gid", "name", "phone", "grp", "opened", "arrived"]); }
function S_RSP() { return sheet_("Responses", ["ts", "inv", "gid", "name", "status", "count", "msg"]); }

function S_STF() { return sheet_("Staff", ["inv", "key"]); }
function staffKey_(inv) { var v = S_STF().getDataRange().getValues(); for (var r = 1; r < v.length; r++) if (String(v[r][0]) === inv) return String(v[r][1]); return ""; }
function canInv_(k, inv) { if (isAdmin_(k)) return true; var sk = staffKey_(String(inv || "")); return !!sk && String(k || "") === sk; }
function newKey_() { var c = "abcdefghjkmnpqrstuvwxyz23456789", o = ""; for (var i = 0; i < 16; i++) o += c.charAt(Math.floor(Math.random() * c.length)); return o; }
function isAdmin_(k) { return String(k || "") === ADMIN_KEY && ADMIN_KEY.indexOf("غيّر") !== 0; }
function clip_(v, n) { return String(v == null ? "" : v).slice(0, n); }
function validId_(i) { return /^[a-z0-9][a-z0-9\-]{1,38}[a-z0-9]$/.test(String(i || "")); }

function readInv_(id) {
  var s = S_INV(), v = s.getDataRange().getValues();
  for (var r = 1; r < v.length; r++) {
    if (String(v[r][0]) === id) {
      var js = "";
      for (var c = 2; c < v[r].length; c++) js += String(v[r][c] || "");
      var cfg = null; try { cfg = JSON.parse(js); } catch (e) {}
      return { row: r + 1, updated: String(v[r][1]), cfg: cfg };
    }
  }
  return null;
}
function writeInv_(id, cfg) {
  var s = S_INV(), js = JSON.stringify(cfg), parts = [], i, now = String(Date.now());
  for (i = 0; i < js.length; i += CHUNK) parts.push(js.slice(i, i + CHUNK));
  var row = [id, now].concat(parts), ex = readInv_(id);
  if (ex) {
    s.getRange(ex.row, 1, 1, Math.max(s.getLastColumn(), row.length)).clearContent();
    s.getRange(ex.row, 1, 1, row.length).setValues([row]);
  } else { s.appendRow(row); }
  return now;
}

function guestsOf_(inv) {
  var v = S_GST().getDataRange().getValues(), a = [];
  for (var r = 1; r < v.length; r++) if (String(v[r][0]) === inv) a.push({ id: String(v[r][1]), name: String(v[r][2]), phone: String(v[r][3]), grp: String(v[r][4]), opened: String(v[r][5] || ""), arrived: String(v[r][6] || "") });
  return a;
}
function latestResp_(inv) {
  var v = S_RSP().getDataRange().getValues(), m = {};
  for (var r = 1; r < v.length; r++) {
    if (String(v[r][1]) !== inv) continue;
    var key = String(v[r][2]) || ("n:" + String(v[r][3]).toLowerCase());
    m[key] = { ts: Number(v[r][0]), gid: String(v[r][2]), name: String(v[r][3]), status: String(v[r][4]), count: Number(v[r][5]) || 0, msg: String(v[r][6] || "") };
  }
  return m;
